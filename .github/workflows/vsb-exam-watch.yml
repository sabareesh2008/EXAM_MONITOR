name: VSB Exam Watch

on:
  schedule:
    # Runs every 5 minutes (maximum allowed frequency on GitHub Actions).
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vsb-exam-watch-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository and saved monitoring state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install OCR support
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Run one monitoring cycle
        env:
          REGISTER_NUMBER: ${{ secrets.REGISTER_NUMBER }}
          STUDENT_NAME: ${{ vars.STUDENT_NAME }}
          DEPARTMENT: ${{ vars.DEPARTMENT || 'ECE' }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_TABLE: ${{ vars.SUPABASE_TABLE || 'allotments' }}
          ALLOW_ALL_EXAM_DATES: 'true'
          DATABASE_PATH: data/state/vsb_exam_watch.sqlite3
          POLL_INTERVAL_MINUTES: '5'
          PYTHONUNBUFFERED: '1'
        run: python main.py --once

      - name: Checkpoint SQLite database
        if: always()
        run: |
          if [ -f data/state/vsb_exam_watch.sqlite3 ]; then
            python - <<'PY'
          import sqlite3
          db = sqlite3.connect('data/state/vsb_exam_watch.sqlite3')
          db.execute('PRAGMA wal_checkpoint(TRUNCATE)')
          db.close()
          PY
          fi

      - name: Save monitoring history and student portal data
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f data/state/vsb_exam_watch.sqlite3 data/state/.gitkeep docs/ portal/ evidence/ allotments.js allotments.json active_notices.json index.html .nojekyll
          if ! git diff --cached --quiet; then
            git commit -m "Update VSB Exam Watch state and student allotments [skip ci]"
            git push
          else
            echo 'No database or portal changes to save.'
          fi
